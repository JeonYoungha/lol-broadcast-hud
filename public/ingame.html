<!doctype html><html lang="ko" class="overlay-page"><head><meta charset="utf-8"><title>In-game Overlay</title><link rel="stylesheet" href="/styles.css"></head><body><main class="overlay ingame" id="app"></main><p class="hud-warning hud-transport-warning" role="status">HUD 연결 끊김</p><script src="/common.js"></script><script>
const logo=(src,cls='logo')=>src?`<img class="${cls}" src="${HUD.escape(src)}" alt="">`:`<span class="logo-fallback">◆</span>`;
const icon=name=>`<svg class="hud-icon" aria-hidden="true"><use href="/hud-icons.svg#icon-${name}"></use></svg>`;
const official=name=>`<img class="official-icon" src="/assets/hud/${name}.png" alt="">`;
const seriesPips=(score,bestOf)=>`<span class="series-pips" title="세트 스코어 ${score}">${Array.from({length:Math.floor((Number(bestOf)||3)/2)+1},(_,i)=>`<i class="${i<Number(score)?'won':''}"></i>`).join('')}</span>`;
const teamIdentity=(t,side,bestOf)=>`<div class="score-team ${side}">${side==='blue'?seriesPips(t.score,bestOf)+logo(t.logo):''}<div class="score-team-copy"><strong>${HUD.escape(t.name||'')}</strong></div>${side==='red'?logo(t.logo)+seriesPips(t.score,bestOf):''}</div>`;
const metric=(kind,value,label,active=true)=>`<span class="score-metric ${kind} ${active?'active':'inactive'}" title="${label}">${kind==='tower'||kind==='gold'?icon(kind):official(kind)}<b>${HUD.escape(value)}</b></span>`;
const goldNumber=value=>{const text=String(value??'').replace(/,/g,'').trim().toUpperCase(),number=parseFloat(text)||0;return text.includes('K')?number*1000:number};
const gapText=value=>{const n=Math.abs(Number(value)||0);return n>=1000?`${(n/1000).toFixed(1)}K`:String(Math.round(n))};
const teamGapText=value=>`${(Math.abs(Number(value)||0)/1000).toFixed(1)}K`;
const goldMetric=(value,gap)=>`<span class="score-metric gold" title="팀 골드">${icon('gold')}<span class="gold-copy"><b>${HUD.escape(value)}</b><em class="${gap>0?'':'empty'}">${gap>0?`+${teamGapText(gap)}`:'+0'}</em></span></span>`;
function updateTopMetrics(header, game, blueGap, redGap) {
  for (const [side, gap] of [['blue', blueGap], ['red', redGap]]) {
    const group = header.querySelector(`.score-numbers.${side}`);
    const setText = (selector, value) => {
      const element = group.querySelector(selector);
      const text = String(value);
      if (element.textContent !== text) element.textContent = text;
      return element;
    };
    setText('.tower b', game[side+'Towers'] || 0);
    setText('.gold-copy b', game[side+'Gold'] || '0.0K');
    setText('.kills', game[side+'Kills'] || 0);
    const difference = setText('.gold-copy em', gap > 0 ? `+${teamGapText(gap)}` : '+0');
    difference.classList.toggle('empty', gap <= 0);
  }
}
const dragonName=t=>{const v=String(t||'').toLowerCase();if(/infernal|fire/.test(v))return'fire';if(/ocean|water/.test(v))return'water';if(/mountain|earth/.test(v))return'earth';if(/cloud|air/.test(v))return'air';if(/hextech/.test(v))return'hextech';if(/chemtech/.test(v))return'chemtech';if(/elder/.test(v))return'elder';return'dragon'};
const dragonAsset=t=>{const name=dragonName(t),mapped={fire:'infernal',water:'ocean',earth:'mountain',air:'cloud'}[name]||name;return mapped==='dragon'?'dragon':`dragon-${mapped}`};
const dragonStack=(types=[],side)=>{const ordered=side==='blue'?[...types].reverse():types;return ordered.length?`<span class="dragon-stack ${side}" title="처치한 드래곤">${ordered.map(t=>`<span class="dragon-badge ${dragonName(t)}">${official(dragonAsset(t))}</span>`).join('')}</span>`:`<span class="dragon-stack empty" title="처치한 드래곤 없음"></span>`};
const roleQuests=(s,side)=>{const q=s.game[side+'RoleQuests']||{};return `<span class="role-quests ${side}" title="역할 퀘스트 완료 현황">${['top','jungle','mid','bot','support'].map(role=>`<img class="role-quest ${q[role]?'complete':''}" src="/assets/hud/role-${role}.svg" alt="${role}" title="${role} 퀘스트 ${q[role]?'완료':'미완료'}">`).join('')}</span>`};
const objectiveContent=(s,side)=>{const dragons=dragonStack(s.game[side+'DragonTypes']||[],side),grubs=metric('grub',s.game[side+'Grubs']||0,'공허 유충');return side==='blue'?roleQuests(s,side)+grubs+dragons:dragons+grubs+roleQuests(s,side)};
const lineupFor=(s,side)=>s.game.lineups?.[side]??s.draft[side+'Picks']??[];
const trinketIds=new Set([3330,3340,3341,3342,3363,3364,3513]);
let itemPrices={};
function itemSlot(item,extra=''){return item?.id?`<span class="item-slot ${extra}"><img src="${HUD.item(item.id)}">${item.count>1?`<b>${item.count}</b>`:''}</span>`:`<span class="item-slot empty ${extra}"></span>`}
function itemSlots(items=[],side){const equipped=[];let trinket=null;for(const [index,item] of (items||[]).entries()){const slot=Number(item.slot);if(slot===6||trinketIds.has(Number(item.id))){trinket=item;continue}if(item?.id)equipped.push({...item,originalSlot:Number.isInteger(slot)?slot:index})}equipped.sort((a,b)=>{const aPrice=itemPrices[a.id],bPrice=itemPrices[b.id];if(aPrice!==undefined&&bPrice!==undefined&&aPrice!==bPrice)return side==='blue'?aPrice-bPrice:bPrice-aPrice;return a.originalSlot-b.originalSlot});const visible=equipped.slice(0,6),empty=Array(Math.max(0,6-visible.length)).fill(null),main=side==='blue'?[...empty,...visible]:[...visible,...empty];const core=`<span class="main-items">${main.map(item=>itemSlot(item)).join('')}</span>`,ward=itemSlot(trinket,'trinket');return side==='blue'?`${ward}${core}`:`${core}${ward}`}
fetch('/api/item-prices').then(r=>r.json()).then(prices=>{itemPrices=prices||{};const state=HUD.state;if(!state)return;for(const side of ['blue','red'])lineupFor(state,side).forEach((pick,i)=>{const list=app.querySelector(`.roster-col.${side} .roster-row[data-row="${i}"] .item-list`);if(list)list.innerHTML=itemSlots(pick.items,side)})}).catch(()=>{});
function rows(s,side){return lineupFor(s,side).map((x,i)=>{const k=x.kda||{},champ=`<div class="champ-cell ${x.isDead?'dead':''}"><img class="mini-champ" src="${HUD.icon(x.id)}" title="${HUD.escape(x.name||'CHAMPION')}"><span class="respawn">${x.isDead?x.respawnTimer||'': ''}</span></div>`,items=`<div class="item-list">${itemSlots(x.items,side)}</div>`,kda=`<div class="kda">${k.kills||0}/${k.deaths||0}/${k.assists||0}</div>`,cs=`<div class="cs"><b>${x.cs??'—'}</b></div>`;return `<div class="roster-row ${side}" data-row="${i}">${side==='blue'?[items,kda,cs,champ].join(''):[champ,cs,kda,items].join('')}</div>`}).join('')}
function laneGoldRows(){return Array.from({length:5},(_,i)=>`<div class="lane-gold-cell even" data-row="${i}">—</div>`).join('')}
let dragonWindowSignature;
function updateDragonWindows(header, game) {
  const enabled = game.nativeDragonStacks === true;
  const config = game.dragonWindow || {};
  const signature = enabled ? JSON.stringify([
    config, game.blueGrubs, game.redGrubs, game.blueRoleQuests, game.redRoleQuests, game.fontSizes?.clock
  ]) : 'off';
  if (signature === dragonWindowSignature) return;
  dragonWindowSignature = signature;
  header.classList.toggle('native-dragon-stacks', enabled);
  if (!enabled) {
    header.style.removeProperty('clip-path');
    return;
  }

  // The native icons sit at the sides of the clock in a 1920×1080 observer capture.
  const setting = (value, fallback, min, max) => Number.isFinite(value)
    ? Math.min(max, Math.max(min, Math.round(value))) : fallback;
  const panelWidth = header.offsetWidth;
  const panelHeight = header.offsetHeight;
  const width = setting(config.width, 88, 20, 150);
  const height = setting(config.height, 36, 12, 38);
  const top = setting(config.top, 62, 50, 95);
  const distance = setting(config.distance, 133, 80, 235);
  const center = panelWidth / 2 + setting(config.shift, 7, -80, 80);
  const clockGuard = Math.max(45, (Number(game.fontSizes?.clock) || 17) * 2);
  const blueLimit = panelWidth / 2 - clockGuard;
  const redLimit = panelWidth / 2 + clockGuard;
  const blueInner = Math.min(center - distance + width / 2, blueLimit);
  const redInner = Math.max(center + distance - width / 2, redLimit);

  const panelLeft = header.getBoundingClientRect().left;
  const blueGrub = header.querySelector('.objective-line.blue .grub').getBoundingClientRect();
  const redGrub = header.querySelector('.objective-line.red .grub').getBoundingClientRect();
  const blueOuter = Math.ceil(blueGrub.right - panelLeft) + 8;
  const redOuter = Math.floor(redGrub.left - panelLeft) - 8;

  const padding = 32;
  const bottom = top + height >= panelHeight ? panelHeight + padding : top + height;
  // Below the original score plate, open a little farther toward the clock.
  const shoulder = Math.min(top + 12, bottom);
  const bevel = Math.min(shoulder + 6, bottom);
  const windows = [[blueOuter, blueInner, Math.min(blueInner + 28, blueLimit)],
    [redOuter, redInner, Math.max(redInner - 28, redLimit)]];
  const outside = `M ${-padding} ${-padding} H ${panelWidth + padding} V ${panelHeight + padding} H ${-padding} Z`;
  const cutouts = windows.map(([outer, inner, nearClock]) =>
    `M ${outer} ${top} H ${inner} V ${shoulder} L ${nearClock} ${bevel} V ${bottom} H ${outer} Z`);
  header.style.clipPath = `path(evenodd, "${outside} ${cutouts.join(' ')}")`;
}
function updateBottomValues(s){for(const side of ['blue','red'])lineupFor(s,side).forEach((pick,i)=>{const row=app.querySelector(`.roster-col.${side} .roster-row[data-row="${i}"]`);if(!row)return;const k=pick.kda||{};row.querySelector('.cs b').textContent=pick.cs??'—';row.querySelector('.kda').textContent=`${k.kills||0}/${k.deaths||0}/${k.assists||0}`;row.querySelector('.champ-cell').classList.toggle('dead',Boolean(pick.isDead));row.querySelector('.respawn').textContent=pick.isDead?(pick.respawnTimer||''):''});Array.from({length:5},(_,i)=>{const value=Number((s.game.laneGoldDiffs||[])[i])||0,side=value>0?'blue':value<0?'red':'even',cell=app.querySelector(`.lane-gold-cell[data-row="${i}"]`);if(!cell)return;cell.className=`lane-gold-cell ${side}`;cell.textContent=value?gapText(value):'—';cell.title=value>0?'블루 우세':value<0?'레드 우세':'동률'})}
let mainSignature='',blueObjectiveSignature='',redObjectiveSignature='',bottomSignature='',playerLabelsSignature='';
function updatePlayerLabels(s) {
  const seats=s.game?.sidePanelRoster;
  const signature=JSON.stringify([s.blue.players,s.red.players,seats]);
  if (signature===playerLabelsSignature) return;
  playerLabelsSignature=signature;
  for (const side of ['blue','red']) {
    const host=app.querySelector(`.player-labels.${side}`);
    host.innerHTML=Array.from({length:5},(_,i)=>{
      const role=seats?.[side]?.[i]?.role;
      const slot=['top','jungle','mid','bot','support'].indexOf(role);
      const name=String(s[side].players?.[slot<0?i:slot]||'').trim();
      return `<div class="player-label-row">${name?`<span class="player-label">${HUD.escape(name)}</span>`:''}</div>`;
    }).join('');
  }
}
HUD.init(s=>{
  const game=s.game,font=game.fontSizes||{};
  app.style.setProperty('--team-name-font',`${Number(font.team)||20}px`);
  app.style.setProperty('--kill-font',`${Number(font.kills)||33}px`);
  app.style.setProperty('--gold-font',`${Number(font.gold)||28}px`);
  app.style.setProperty('--gold-diff-font',`${Number(font.goldDiff)||14}px`);
  app.style.setProperty('--clock-font',`${Number(font.clock)||17}px`);
  app.style.setProperty('--lane-gold-font',`${Number(font.laneGold)||14}px`);
  if (!app.firstElementChild) app.innerHTML=`<div class="player-labels blue"></div><div class="player-labels red"></div><header class="match-hud"><div class="match-main"></div><div class="match-sub"><div class="objective-line blue"></div><div class="clock-block"><b></b></div><div class="objective-line red"></div></div></header><p class="hud-warning hud-live-warning" role="status" hidden></p><section class="bottom-hud"></section>`;
  updatePlayerLabels(s);
  const header=app.querySelector('.match-hud');
  header.style.setProperty('--blue',s.blue.color);
  header.style.setProperty('--red',s.red.color);
  const blueGold=goldNumber(game.blueGold),redGold=goldNumber(game.redGold);
  const blueGap=Math.max(0,blueGold-redGold),redGap=Math.max(0,redGold-blueGold);
  const teamMark=({name,logo,score})=>[name,logo,score];
  const mainSig=JSON.stringify([teamMark(s.blue),teamMark(s.red),s.event.bestOf,s.event.logo]);
  if (mainSig!==mainSignature) {
    mainSignature=mainSig;
    header.querySelector('.match-main').innerHTML=`${teamIdentity(s.blue,'blue',s.event.bestOf)}<div class="score-numbers blue">${metric('tower',game.blueTowers||0,'포탑')}${goldMetric(game.blueGold||'0.0K',blueGap)}<strong class="kills">${game.blueKills||0}</strong></div><div class="match-mark">${s.event.logo?logo(s.event.logo,'match-event-logo'):'<span>◆</span>'}</div><div class="score-numbers red"><strong class="kills">${game.redKills||0}</strong>${goldMetric(game.redGold||'0.0K',redGap)}${metric('tower',game.redTowers||0,'포탑')}</div>${teamIdentity(s.red,'red',s.event.bestOf)}`;
  }
  updateTopMetrics(header,game,blueGap,redGap);
  for (const side of ['blue','red']) {
    const sig=JSON.stringify([game[side+'DragonTypes'],game[side+'Grubs'],game[side+'RoleQuests']]);
    if (side==='blue'&&sig!==blueObjectiveSignature) {
      blueObjectiveSignature=sig;
      header.querySelector('.objective-line.blue').innerHTML=objectiveContent(s,side);
    }
    if (side==='red'&&sig!==redObjectiveSignature) {
      redObjectiveSignature=sig;
      header.querySelector('.objective-line.red').innerHTML=objectiveContent(s,side);
    }
  }
  header.querySelector('.clock-block b').textContent=game.clock||'00:00';
  updateDragonWindows(header,game);
  const liveWarning=app.querySelector('.hud-live-warning');
  liveWarning.hidden=game.liveFeed?.status!=='stale';
  if(!liveWarning.hidden){
    const text=`관전 데이터 끊김 · 마지막 갱신 ${game.liveFeed.clock||game.clock||'—'}`;
    if(liveWarning.textContent!==text)liveWarning.textContent=text;
  }

  const bottom=app.querySelector('.bottom-hud');
  const position=game.bottomScoreboard||{};
  const offset=(value,min,max)=>Math.min(max,Math.max(min,Math.round(Number(value)||0)));
  bottom.style.setProperty('--bottom-x',`${offset(position.x,-440,440)}px`);
  bottom.style.setProperty('--bottom-y',`${-offset(position.y,0,842)}px`);
  bottom.classList.toggle('hidden',!game.showBottom);
  const rosterLayout=side=>lineupFor(s,side).map(p=>({id:p.id,items:p.items?.map(({id,slot,count})=>[id,slot,count])}));
  const bottomSig=JSON.stringify([rosterLayout('blue'),rosterLayout('red'),s.blue.color,s.red.color,s.event.name]);
  if (bottomSig!==bottomSignature) {
    bottomSignature=bottomSig;
    bottom.innerHTML=`<div class="hud-table-head" style="--blue:${s.blue.color};--red:${s.red.color}"><span>${HUD.escape(s.event.name)}</span></div><div class="roster-table"><div class="roster-col blue">${rows(s,'blue')}</div><div class="lane-gold-col">${laneGoldRows()}</div><div class="roster-col red">${rows(s,'red')}</div></div>`;
  }
  updateBottomValues(s);
});
</script></body></html>
