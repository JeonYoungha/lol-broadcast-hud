<!doctype html><html lang="ko" class="overlay-page"><head><meta charset="utf-8"><title>In-game Overlay</title><link rel="stylesheet" href="/styles.css"></head><body><main class="overlay ingame" id="app"></main><script src="/common.js"></script><script>
const logo=(src,cls='logo')=>src?`<img class="${cls}" src="${HUD.escape(src)}" alt="">`:`<span class="logo-fallback">◆</span>`;
const icon=name=>`<svg class="hud-icon" aria-hidden="true"><use href="/hud-icons.svg#icon-${name}"></use></svg>`;
const official=name=>`<img class="official-icon" src="/assets/hud/${name}.png" alt="">`;
const fmtTime=n=>`${Math.floor((Number(n)||0)/60)}:${String((Number(n)||0)%60).padStart(2,'0')}`;
const seriesPips=(score,bestOf)=>`<span class="series-pips" title="세트 스코어 ${score}">${Array.from({length:Math.floor((Number(bestOf)||3)/2)+1},(_,i)=>`<i class="${i<Number(score)?'won':''}"></i>`).join('')}</span>`;
const teamIdentity=(t,side,bestOf)=>`<div class="score-team ${side}">${side==='blue'?seriesPips(t.score,bestOf)+logo(t.logo):''}<div class="score-team-copy"><strong>${HUD.escape(t.name||'')}</strong></div>${side==='red'?logo(t.logo)+seriesPips(t.score,bestOf):''}</div>`;
const metric=(kind,value,label,active=true)=>`<span class="score-metric ${kind} ${active?'active':'inactive'}" title="${label}">${kind==='tower'||kind==='gold'?icon(kind):official(kind)}<b>${HUD.escape(value)}</b></span>`;
const goldNumber=value=>{const text=String(value??'').replace(/,/g,'').trim().toUpperCase(),number=parseFloat(text)||0;return text.includes('K')?number*1000:number};
const gapText=value=>{const n=Math.abs(Number(value)||0);return n>=1000?`${(n/1000).toFixed(1)}K`:String(Math.round(n))};
const teamGapText=value=>`${(Math.abs(Number(value)||0)/1000).toFixed(1)}K`;
const goldMetric=(value,gap)=>`<span class="score-metric gold" title="팀 골드">${icon('gold')}<span class="gold-copy"><b>${HUD.escape(value)}</b><em class="${gap>0?'':'empty'}">${gap>0?`+${teamGapText(gap)}`:'+0'}</em></span></span>`;
const dragonName=t=>{const v=String(t||'').toLowerCase();if(/infernal|fire/.test(v))return'fire';if(/ocean|water/.test(v))return'water';if(/mountain|earth/.test(v))return'earth';if(/cloud|air/.test(v))return'air';if(/hextech/.test(v))return'hextech';if(/chemtech/.test(v))return'chemtech';if(/elder/.test(v))return'elder';return'dragon'};
const dragonAsset=t=>{const name=dragonName(t),mapped={fire:'infernal',water:'ocean',earth:'mountain',air:'cloud'}[name]||name;return mapped==='dragon'?'dragon':`dragon-${mapped}`};
const dragonStack=(types=[],side)=>{const ordered=side==='blue'?[...types].reverse():types;return ordered.length?`<span class="dragon-stack ${side}" title="처치한 드래곤">${ordered.map(t=>`<span class="dragon-badge ${dragonName(t)}">${official(dragonAsset(t))}</span>`).join('')}</span>`:`<span class="dragon-stack empty" title="처치한 드래곤 없음"></span>`};
const roleQuests=(s,side)=>{const q=s.game[side+'RoleQuests']||{};return `<span class="role-quests ${side}" title="역할 퀘스트 완료 현황">${['top','jungle','mid','bot','support'].map(role=>`<img class="role-quest ${q[role]?'complete':''}" src="/assets/hud/role-${role}.svg" alt="${role}" title="${role} 퀘스트 ${q[role]?'완료':'미완료'}">`).join('')}</span>`};
const objectiveContent=(s,side)=>{const dragons=dragonStack(s.game[side+'DragonTypes']||[],side),grubs=metric('grub',s.game[side+'Grubs']||0,'공허 유충');return side==='blue'?roleQuests(s,side)+grubs+dragons:dragons+grubs+roleQuests(s,side)};
function updateSpawnTimer(kind,seconds,iconKey){const host=app.querySelector('.spawn-timers'),value=Number(seconds)||0;let el=host.querySelector(`[data-spawn="${kind}"]`);if(value<=0){if(el)el.remove();return}if(!el||el.dataset.icon!==iconKey){const markup=`<div class="spawn-timer ${kind}" data-spawn="${kind}" data-icon="${iconKey}">${kind==='baron'?icon('baron'):official(iconKey)}<b></b><small>${kind.toUpperCase()}</small></div>`;if(el)el.outerHTML=markup;else host.insertAdjacentHTML('beforeend',markup);el=host.querySelector(`[data-spawn="${kind}"]`)}el.querySelector('b').textContent=fmtTime(value)}
const trinketIds=new Set([3330,3340,3341,3342,3363,3364,3513]);
let itemPrices={};
function itemSlot(item,extra=''){return item?.id?`<span class="item-slot ${extra}"><img src="${HUD.item(item.id)}">${item.count>1?`<b>${item.count}</b>`:''}</span>`:`<span class="item-slot empty ${extra}"></span>`}
function itemSlots(items=[],side){const equipped=[];let trinket=null;for(const [index,item] of (items||[]).entries()){const slot=Number(item.slot);if(slot===6||trinketIds.has(Number(item.id))){trinket=item;continue}if(item?.id)equipped.push({...item,originalSlot:Number.isInteger(slot)?slot:index})}equipped.sort((a,b)=>{const aPrice=itemPrices[a.id],bPrice=itemPrices[b.id];if(aPrice!==undefined&&bPrice!==undefined&&aPrice!==bPrice)return side==='blue'?aPrice-bPrice:bPrice-aPrice;return a.originalSlot-b.originalSlot});const visible=equipped.slice(0,6),empty=Array(Math.max(0,6-visible.length)).fill(null),main=side==='blue'?[...empty,...visible]:[...visible,...empty];const core=`<span class="main-items">${main.map(item=>itemSlot(item)).join('')}</span>`,ward=itemSlot(trinket,'trinket');return side==='blue'?`${ward}${core}`:`${core}${ward}`}
fetch('/api/item-prices').then(r=>r.json()).then(prices=>{itemPrices=prices||{};const state=HUD.state;if(!state)return;for(const side of ['blue','red'])(state.draft[side+'Picks']||[]).forEach((pick,i)=>{const list=app.querySelector(`.roster-col.${side} .roster-row[data-row="${i}"] .item-list`);if(list)list.innerHTML=itemSlots(pick.items,side)})}).catch(()=>{});
function rows(s,side){const p=s.draft[side+'Picks'];return p.map((x,i)=>{const k=x.kda||{},champ=`<div class="champ-cell ${x.isDead?'dead':''}"><img class="mini-champ" src="${HUD.icon(x.id)}" title="${HUD.escape(x.name||'CHAMPION')}"><span class="respawn">${x.isDead?x.respawnTimer||'': ''}</span></div>`,items=`<div class="item-list">${itemSlots(x.items,side)}</div>`,kda=`<div class="kda">${k.kills||0}/${k.deaths||0}/${k.assists||0}</div>`,cs=`<div class="cs"><b>${x.cs||0}</b></div>`;return `<div class="roster-row ${side}" data-row="${i}">${side==='blue'?[items,kda,cs,champ].join(''):[champ,cs,kda,items].join('')}</div>`}).join('')}
function laneGoldRows(){return Array.from({length:5},(_,i)=>`<div class="lane-gold-cell even" data-row="${i}">—</div>`).join('')}
function updateBottomValues(s){for(const side of ['blue','red'])(s.draft[side+'Picks']||[]).forEach((pick,i)=>{const row=app.querySelector(`.roster-col.${side} .roster-row[data-row="${i}"]`);if(!row)return;const k=pick.kda||{};row.querySelector('.cs b').textContent=pick.cs||0;row.querySelector('.kda').textContent=`${k.kills||0}/${k.deaths||0}/${k.assists||0}`;row.querySelector('.champ-cell').classList.toggle('dead',Boolean(pick.isDead));row.querySelector('.respawn').textContent=pick.isDead?(pick.respawnTimer||''):''});Array.from({length:5},(_,i)=>{const value=Number((s.game.laneGoldDiffs||[])[i])||0,side=value>0?'blue':value<0?'red':'even',cell=app.querySelector(`.lane-gold-cell[data-row="${i}"]`);if(!cell)return;cell.className=`lane-gold-cell ${side}`;cell.textContent=value?gapText(value):'—';cell.title=value>0?'블루 우세':value<0?'레드 우세':'동률'})}
let mainSignature='',blueObjectiveSignature='',redObjectiveSignature='',bottomSignature='';
HUD.init(s=>{const font=s.game.fontSizes||{};app.style.setProperty('--team-name-font',`${Number(font.team)||20}px`);app.style.setProperty('--kill-font',`${Number(font.kills)||33}px`);app.style.setProperty('--gold-font',`${Number(font.gold)||28}px`);app.style.setProperty('--gold-diff-font',`${Number(font.goldDiff)||14}px`);app.style.setProperty('--clock-font',`${Number(font.clock)||17}px`);app.style.setProperty('--lane-gold-font',`${Number(font.laneGold)||14}px`);if(!app.firstElementChild)app.innerHTML=`<aside class="spawn-timers"></aside><header class="match-hud"><div class="match-main"></div><div class="match-sub"><div class="objective-line blue"></div><div class="clock-block"><b></b></div><div class="objective-line red"></div></div></header><section class="bottom-hud"></section>`;const header=app.querySelector('.match-hud');header.style.setProperty('--blue',s.blue.color);header.style.setProperty('--red',s.red.color);const blueGold=goldNumber(s.game.blueGold),redGold=goldNumber(s.game.redGold),blueGap=Math.max(0,blueGold-redGold),redGap=Math.max(0,redGold-blueGold);const mainSig=JSON.stringify({blue:s.blue,red:s.red,bestOf:s.event.bestOf,eventName:s.event.name,eventLogo:s.event.logo,blueKills:s.game.blueKills,redKills:s.game.redKills,blueGold:s.game.blueGold,redGold:s.game.redGold,blueTowers:s.game.blueTowers,redTowers:s.game.redTowers});if(mainSig!==mainSignature){mainSignature=mainSig;app.querySelector('.match-main').innerHTML=`${teamIdentity(s.blue,'blue',s.event.bestOf)}<div class="score-numbers blue">${metric('tower',s.game.blueTowers||0,'포탑')}${goldMetric(s.game.blueGold||'0.0K',blueGap)}<strong class="kills">${s.game.blueKills||0}</strong></div><div class="match-mark">${s.event.logo?logo(s.event.logo,'match-event-logo'):'<span>◆</span>'}</div><div class="score-numbers red"><strong class="kills">${s.game.redKills||0}</strong>${goldMetric(s.game.redGold||'0.0K',redGap)}${metric('tower',s.game.redTowers||0,'포탑')}</div>${teamIdentity(s.red,'red',s.event.bestOf)}`};for(const side of ['blue','red']){const sig=JSON.stringify({dragons:s.game[side+'DragonTypes'],grubs:s.game[side+'Grubs'],quests:s.game[side+'RoleQuests']});if(side==='blue'&&sig!==blueObjectiveSignature){blueObjectiveSignature=sig;app.querySelector('.objective-line.blue').innerHTML=objectiveContent(s,side)}if(side==='red'&&sig!==redObjectiveSignature){redObjectiveSignature=sig;app.querySelector('.objective-line.red').innerHTML=objectiveContent(s,side)}}const dragonIcon=dragonAsset(s.game.nextDragonType||'');updateSpawnTimer('baron',s.game.baronRespawn,'baron');updateSpawnTimer('dragon',s.game.dragonRespawn,dragonIcon);app.querySelector('.clock-block b').textContent=s.game.clock||'00:00';const rosterLayout=side=>(s.draft[side+'Picks']||[]).map(p=>({id:p.id,items:p.items,spells:p.spells}));const bottomSig=JSON.stringify({show:s.game.showBottom,blue:rosterLayout('blue'),red:rosterLayout('red'),blueColor:s.blue.color,redColor:s.red.color,eventName:s.event.name});if(bottomSig!==bottomSignature){bottomSignature=bottomSig;const bottom=app.querySelector('.bottom-hud');bottom.classList.toggle('hidden',!s.game.showBottom);bottom.innerHTML=`<div class="hud-table-head" style="--blue:${s.blue.color};--red:${s.red.color}"><span>${HUD.escape(s.event.name)}</span></div><div class="roster-table"><div class="roster-col blue">${rows(s,'blue')}</div><div class="lane-gold-col">${laneGoldRows()}</div><div class="roster-col red">${rows(s,'red')}</div></div>`}updateBottomValues(s)})
</script></body></html>
